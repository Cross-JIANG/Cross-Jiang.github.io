<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross网站导航 | 分类卡片 + 实时搜索</title>
  <meta name="description" content="按分类整理的常用网站导航，支持实时搜索、逐行结果展示、分类折叠与网站详情页。">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('nav-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f5f7fb;
      --bg-alt: #eef2f8;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, .1);
      --on-accent: #ffffff;
      --radius: 16px;
      --shadow-sm: 0 1px 2px rgb(15 23 42 / .06);
      --shadow: 0 20px 40px -24px rgb(15 23 42 / .4);
      --max: 1180px;
      --header-h: 66px;
    }

    [data-theme="dark"] {
      --bg: #0a0f1c;
      --bg-alt: #0e1526;
      --surface: #121a2c;
      --text: #e8eefb;
      --muted: #93a2b8;
      --line: #1f2b44;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, .15);
      --on-accent: #071022;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / .5);
      --shadow: 0 22px 44px -26px rgb(0 0 0 / .95);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-h) + 20px);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s ease, color .3s ease;
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    ul { margin: 0; padding: 0; list-style: none; }
    h1, h2, h3, p { margin: 0; }

    [hidden] { display: none !important; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }

    mark {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 4px;
      padding: 0 2px;
    }

    .container {
      width: 100%;
      max-width: var(--max);
      margin-inline: auto;
      padding-inline: 20px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--bg);
      border-bottom: 1px solid transparent;
      transition: border-color .3s, box-shadow .3s, background-color .3s;
    }
    .site-header.is-scrolled {
      border-bottom-color: var(--line);
      box-shadow: 0 1px 16px rgb(15 23 42 / .08);
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: var(--header-h);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex: none;
      font-weight: 800;
      font-size: 1.02rem;
      letter-spacing: -.02em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      font-size: .8rem;
    }
    .brand-text { display: none; }
    @media (min-width: 480px) { .brand-text { display: inline; } }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 560px;
      margin-inline: auto;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 5px 5px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      transition: border-color .2s, box-shadow .2s;
    }
    .search-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .search-icon { flex: none; font-size: .92rem; color: var(--muted); }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 7px 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: .93rem;
      outline: none;
    }
    #searchInput::-webkit-search-cancel-button { display: none; }

    .search-clear {
      flex: none;
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 50%;
      background: var(--bg-alt);
      color: var(--muted);
      font-size: .72rem;
      line-height: 1;
    }
    .search-clear:hover { color: var(--text); }

    .search-submit {
      flex: none;
      padding: 8px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: .85rem;
      font-weight: 600;
      transition: filter .2s, transform .2s;
    }
    .search-submit:hover { filter: brightness(1.08); transform: translateY(-1px); }

    .suggest {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 80;
      max-height: min(420px, 62vh);
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 6px;
      animation: suggestIn .18s ease both;
    }
    @keyframes suggestIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: none; }
    }

    .suggest-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      border-radius: 11px;
      transition: background-color .15s;
    }
    .suggest-item:hover,
    .suggest-item.is-active { background: var(--accent-soft); }

    .suggest-icon {
      flex: none;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      font-size: 1rem;
      line-height: 1;
    }
    .suggest-main { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
    .suggest-name {
      font-size: .9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .suggest-cat {
      flex: none;
      font-size: .72rem;
      color: var(--muted);
    }

    .suggest-empty {
      padding: 16px 12px;
      text-align: center;
      font-size: .86rem;
      color: var(--muted);
    }

    .icon-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1;
      transition: border-color .2s, transform .2s;
    }
    .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

    .icon-box {
      overflow: hidden;
    }
    .icon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;   /* 保持比例，图不会被拉伸 */
      padding: 10%;          /* 四周留白，图标不会贴边 */
      display: block;
    }

    .home-hero {
      position: relative;
      overflow: hidden;
      padding: clamp(44px, 7vw, 84px) 0 clamp(24px, 3vw, 36px);
    }
    .home-hero::before {
      content: "";
      position: absolute;
      inset: -60% -10% auto;
      height: 170%;
      background: radial-gradient(42% 52% at 50% 45%, var(--accent-soft), transparent 70%);
      pointer-events: none;
    }
    .home-hero .container { position: relative; }

    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      padding: 5px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .home-hero h1 {
      font-size: clamp(1.7rem, 4.4vw, 2.7rem);
      line-height: 1.18;
      letter-spacing: -.035em;
      margin-bottom: 14px;
    }

    .home-hero .lead {
      max-width: 62ch;
      font-size: clamp(.95rem, 1.4vw, 1.04rem);
      color: var(--muted);
    }

    .cat-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 26px;
    }
    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: .85rem;
      font-weight: 600;
      transition: all .2s ease;
    }
    .cat-chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    .cat-chip span {
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--bg-alt);
      font-size: .72rem;
      font-weight: 700;
    }

    .cat-section { padding: clamp(26px, 3.4vw, 40px) 0; }

    .cat-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .cat-section-head h2 {
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      letter-spacing: -.02em;
    }

    .cat-head-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: none;
    }

    .cat-count { font-size: .82rem; color: var(--muted); }

    .cat-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: .82rem;
      font-weight: 600;
      white-space: nowrap;
      transition: border-color .2s, color .2s, transform .2s, background-color .2s;
    }
    .cat-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .cat-toggle .chev {
      font-size: .68rem;
      line-height: 1;
      transition: transform .3s ease;
    }
    .cat-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

    .site-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      transition: max-height .45s cubic-bezier(.4, 0, .2, 1);
    }
    .site-grid.is-collapsed { overflow: hidden; }

    .site-card {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .site-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }

    .site-icon {
      flex: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 1.3rem;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / .16);
    }

    .site-body { min-width: 0; display: grid; gap: 3px; }

    .site-name {
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .site-desc {
      font-size: .82rem;
      line-height: 1.55;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .search-view { padding: clamp(28px, 4vw, 48px) 0 clamp(48px, 6vw, 76px); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      font-size: .86rem;
      font-weight: 600;
      color: var(--muted);
      transition: color .2s, gap .2s;
    }
    .back-link:hover { color: var(--accent); gap: 10px; }

    .search-head { margin-bottom: 26px; }
    .search-head h1 {
      font-size: clamp(1.4rem, 3.2vw, 2rem);
      letter-spacing: -.03em;
      margin-bottom: 6px;
    }
    .search-meta { font-size: .9rem; color: var(--muted); }
    .search-meta strong { color: var(--accent); }

    .result-list { display: grid; gap: 12px; }

    .result-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .5s ease,
                  transform .5s cubic-bezier(.22, .61, .36, 1),
                  border-color .2s ease,
                  box-shadow .25s ease;
    }
    .result-row.is-in { opacity: 1; transform: none; }
    .result-row:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }

    .result-icon {
      flex: none;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      font-size: 1.3rem;
      line-height: 1;
    }

    .result-body { min-width: 0; flex: 1; display: grid; gap: 3px; }

    .result-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .result-name { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; }
    .result-cat {
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .72rem;
      font-weight: 700;
    }
    .result-desc {
      font-size: .85rem;
      line-height: 1.6;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-arrow {
      flex: none;
      font-size: .95rem;
      color: var(--muted);
      transition: color .2s, transform .25s;
    }
    .result-row:hover .result-arrow {
      color: var(--accent);
      transform: translate(3px, -3px);
    }

    .empty-state {
      padding: clamp(48px, 9vw, 90px) 20px;
      text-align: center;
    }
    .empty-icon {
      font-size: 2.4rem;
      margin-bottom: 12px;
      opacity: .55;
    }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .empty-state p { font-size: .9rem; color: var(--muted); }

    .detail-view { padding: clamp(28px, 4vw, 48px) 0 clamp(48px, 6vw, 76px); }

    .detail-card {
      padding: clamp(24px, 4.5vw, 44px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .detail-icon {
      flex: none;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      font-size: 2.1rem;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / .18);
    }

    .detail-head h1 {
      font-size: clamp(1.5rem, 3.4vw, 2.05rem);
      letter-spacing: -.03em;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      padding: 3px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .73rem;
      font-weight: 700;
    }
    .tag-soft { background: var(--bg-alt); color: var(--muted); }

    .detail-desc {
      font-size: clamp(.94rem, 1.4vw, 1.02rem);
      line-height: 1.8;
      color: var(--muted);
      max-width: 68ch;
      margin-bottom: 26px;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: .9rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color .2s, color .2s, border-color .2s,
                  transform .2s, box-shadow .2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: 0 8px 20px -10px var(--accent);
    }
    .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.08); }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    .copy-tip {
      font-size: .82rem;
      font-weight: 600;
      color: #059669;
      opacity: 0;
      transition: opacity .25s;
    }
    .copy-tip.is-show { opacity: 1; }

    .detail-url {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--bg-alt);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .82rem;
      color: var(--muted);
      word-break: break-all;
    }

    .related { margin-top: clamp(32px, 5vw, 52px); }
    .related h2 {
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      letter-spacing: -.02em;
      margin-bottom: 16px;
    }

    .site-footer {
      padding: 36px 0 28px;
      background: var(--bg-alt);
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .86rem;
    }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 24px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .55s ease, transform .55s cubic-bezier(.22, .61, .36, 1);
      will-change: opacity, transform;
    }
    .reveal.is-visible { opacity: 1; transform: none; }

    @media (max-width: 900px) {
      .header-inner {
        flex-wrap: wrap;
        gap: 10px;
        padding-block: 10px;
      }
      .search-box { order: 5; flex: 1 1 100%; max-width: none; }
    }

    @media (max-width: 640px) {
      .cat-section-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .cat-head-right { width: 100%; justify-content: space-between; }
    }

    @media (max-width: 560px) {
      .search-submit { padding: 8px 14px; }
      .site-grid { grid-template-columns: 1fr; }
      .result-row { padding: 13px 14px; gap: 12px; }
      .result-icon { width: 40px; height: 40px; font-size: 1.1rem; }
      .detail-icon { width: 60px; height: 60px; font-size: 1.7rem; border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
      .reveal { opacity: 1; transform: none; }
      .result-row { opacity: 1; transform: none; }
      .site-grid { transition: none; }
    }
  </style>
</head>

<body>
  <a href="#main"
     style="position:absolute;left:-9999px;top:8px;z-index:100"
     onfocus="this.style.left='8px'" onblur="this.style.left='-9999px'"
     class="tag">跳到主内容</a>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <span class="brand-text">Cross网站导航</span>
      </a>

      <div class="search-box" id="searchBox">
        <form class="search-form" id="searchForm" role="search" autocomplete="off">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="searchInput" type="search" name="q"
                 placeholder="搜索网站名称、分类或关键词…"
                 aria-label="搜索网站" aria-expanded="false"
                 aria-controls="suggest" autocomplete="off">
          <button class="search-clear" id="searchClear" type="button"
                  aria-label="清空搜索" hidden>✕</button>
          <button class="search-submit" type="submit">搜索</button>
        </form>
        <div class="suggest" id="suggest" role="listbox" aria-label="搜索建议" hidden></div>
      </div>

      <button class="icon-btn" id="themeToggle" type="button"
              aria-label="切换深色 / 浅色主题">🌙</button>
    </div>
  </header>

  <main id="main">
    <div id="viewRoot"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year">2026</span> Cross网站导航</span>
      <span>Cross & SAKANAthree</span>
    </div>
  </footer>

  <script>
  (function () {
    'use strict';

    /* =========================================================
       1. 数据源

    /* =========================================================
       2. 工具函数
       ========================================================= */
    const $  = (sel, ctx) => (ctx || document).querySelector(sel);
    const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    function highlight(text, q) {
      const safe = escapeHtml(text);
      const key = String(q || '').trim();
      if (!key) return safe;
      const re = new RegExp('(' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return safe.replace(re, '<mark>$1</mark>');
    }

    function searchSites(q) {
      const key = String(q || '').trim().toLowerCase();
      if (!key) return [];

      const hits = [];
      SITES.forEach(function (s) {
        let sc = 0;
        const name = s.name.toLowerCase();

        if (name === key)                         sc += 200;
        else if (name.startsWith(key))            sc += 120;
        else if (name.indexOf(key) > -1)          sc += 80;

        if (s.id.indexOf(key) > -1)               sc += 60;
        if (s.tags.some(t => t.toLowerCase().indexOf(key) > -1)) sc += 40;
        if (s.cat.toLowerCase().indexOf(key) > -1) sc += 30;
        if (s.url.toLowerCase().indexOf(key) > -1) sc += 25;
        if (s.desc.toLowerCase().indexOf(key) > -1) sc += 15;

        if (sc > 0) hits.push({ site: s, score: sc });
      });

      hits.sort(function (a, b) {
        return b.score - a.score || a.site.name.localeCompare(b.site.name, 'zh');
      });

      return hits.map(h => h.site);
    }

    function gradient(s) {
      return 'linear-gradient(135deg, ' + s.color[0] + ', ' + s.color[1] + ')';
    }

    /** 渲染图标：有 img 用图片，没有则回退到 emoji 渐变块 */
    function iconHTML(s, cls) {
      if (s.img) {
        return '' +
          '<span class="' + cls + ' icon-box" style="background:#fff" aria-hidden="true">' +
            '<img class="icon-img" src="' + s.img + '" alt="" loading="lazy" ' +
                'onerror="this.parentNode.classList.remove(\'icon-box\');this.parentNode.innerHTML=\'' + 
                (s.icon || '🔗') + '\';this.parentNode.style.background=\'linear-gradient(135deg, ' + 
                s.color[0] + ', ' + s.color[1] + ')\';">' +
          '</span>';
      }
      return '<span class="' + cls + '" style="background:' + gradient(s) + '" aria-hidden="true">' +
            (s.icon || '🔗') + '</span>';
    }

    /* =========================================================
       3. 渲染片段
       ========================================================= */
    function cardHTML(s) {
      return '' +
        '<a class="site-card reveal" href="#/site/' + encodeURIComponent(s.id) + '">' +
          iconHTML(s, 'site-icon') +
          '<span class="site-body">' +
            '<span class="site-name">' + escapeHtml(s.name) + '</span>' +
            '<span class="site-desc">' + escapeHtml(s.desc) + '</span>' +
          '</span>' +
        '</a>';
    }

    function resultRowHTML(s, q) {
      return '' +
        '<a class="result-row" href="#/site/' + encodeURIComponent(s.id) + '">' +
          iconHTML(s, 'result-icon') +
          '<span class="result-body">' +
            '<span class="result-top">' +
              '<span class="result-name">' + highlight(s.name, q) + '</span>' +
              '<span class="result-cat">' + escapeHtml(s.cat) + '</span>' +
            '</span>' +
            '<span class="result-desc">' + highlight(s.desc, q) + '</span>' +
          '</span>' +
          '<span class="result-arrow" aria-hidden="true">↗</span>' +
        '</a>';
    }

    /* =========================================================
       4. 分类折叠
       ========================================================= */
    function firstRowHeight(grid) {
      const cards = Array.from(grid.children).filter(function (el) {
        return el.offsetParent !== null;
      });
      if (!cards.length) return 0;

      const firstTop = cards[0].offsetTop;
      let bottom = 0;

      cards.forEach(function (c) {
        if (Math.abs(c.offsetTop - firstTop) < 2) {
          bottom = Math.max(bottom, c.offsetTop + c.offsetHeight);
        }
      });

      return bottom - firstTop;
    }

    function revealHiddenCards(grid) {
      Array.from(grid.children).forEach(function (c, i) {
        if (!c.classList.contains('is-visible')) {
          window.setTimeout(function () {
            c.classList.add('is-visible');
          }, Math.min(i, 12) * 30);
        }
      });
    }

    function initCollapsibles() {
      $$('[data-collapsible]').forEach(function (grid) {
        const section = grid.closest('.cat-section');
        if (!section) return;
        const btn = $('.cat-toggle', section);
        if (!btn) return;

        const rowH  = firstRowHeight(grid);
        const fullH = grid.scrollHeight;

        if (fullH <= rowH + 4) {
          btn.hidden = true;
          grid.classList.remove('is-collapsed');
          grid.style.maxHeight = '';
        } else {
          btn.hidden = false;
          grid.classList.add('is-collapsed');
          grid.style.maxHeight = rowH + 'px';
          btn.setAttribute('aria-expanded', 'false');
          btn.innerHTML = '展开全部<span class="chev" aria-hidden="true">▾</span>';
        }

        btn.addEventListener('click', function () {
          const collapsed = grid.classList.contains('is-collapsed');

          if (collapsed) {
            const h = grid.scrollHeight;
            grid.style.maxHeight = h + 'px';
            grid.classList.remove('is-collapsed');
            btn.setAttribute('aria-expanded', 'true');
            btn.innerHTML = '收起<span class="chev" aria-hidden="true">▾</span>';
            revealHiddenCards(grid);
          } else {
            const rh = firstRowHeight(grid);
            grid.style.maxHeight = rh + 'px';
            grid.classList.add('is-collapsed');
            btn.setAttribute('aria-expanded', 'false');
            btn.innerHTML = '展开全部<span class="chev" aria-hidden="true">▾</span>';
          }
        });
      });
    }

    let resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        $$('[data-collapsible]').forEach(function (grid) {
          const section = grid.closest('.cat-section');
          if (!section) return;
          const btn = $('.cat-toggle', section);
          if (!btn) return;

          const rowH  = firstRowHeight(grid);
          const fullH = grid.scrollHeight;

          if (fullH <= rowH + 4) {
            btn.hidden = true;
            grid.classList.remove('is-collapsed');
            grid.style.maxHeight = '';
          } else {
            btn.hidden = false;
            if (grid.classList.contains('is-collapsed')) {
              grid.style.maxHeight = rowH + 'px';
            } else {
              grid.style.maxHeight = fullH + 'px';
            }
          }
        });
      }, 150);
    });

    /* =========================================================
       5. 视图渲染
       ========================================================= */
    const viewRoot = $('#viewRoot');

    function renderHome() {
      const grouped = {};
      SITES.forEach(function (s) {
        (grouped[s.cat] = grouped[s.cat] || []).push(s);
      });

      const cats = CATEGORY_ORDER.filter(c => grouped[c]);

      let html = '' +
        '<section class="home-hero">' +
          '<div class="container">' +
            '<p class="eyebrow">Cross & SAKANAthree</p>' +
            '<h1>把官方网站都收在一个页面里，<br>让你不再误入盗版网站</h1>' +
            '<p class="lead">按分类整理了 ' + SITES.length + ' 个常用网站，' +
              '点击任意卡片即可查看简介与直达链接。每个分类都可以展开或收起，' +
              '也可以直接在顶部搜索关键词。</p>' +
            '<div class="cat-nav">' +
              cats.map(function (c, i) {
                return '<button class="cat-chip" type="button" data-target="cat-' + i + '">' +
                         escapeHtml(c) + '<span>' + grouped[c].length + '</span>' +
                       '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
        '</section>';

      html += cats.map(function (c, i) {
        return '' +
          '<section class="cat-section" id="cat-' + i + '">' +
            '<div class="container">' +
              '<div class="cat-section-head">' +
                '<h2>' + escapeHtml(c) + '</h2>' +
                '<div class="cat-head-right">' +
                  '<span class="cat-count">' + grouped[c].length + ' 个网站</span>' +
                  '<button class="cat-toggle" type="button" hidden aria-expanded="false">' +
                    '展开全部<span class="chev" aria-hidden="true">▾</span>' +
                  '</button>' +
                '</div>' +
              '</div>' +
              '<div class="site-grid" data-collapsible>' +
                grouped[c].map(cardHTML).join('') +
              '</div>' +
            '</div>' +
          '</section>';
      }).join('');

      viewRoot.innerHTML = html;

      $$('.cat-chip', viewRoot).forEach(function (chip) {
        chip.addEventListener('click', function () {
          const target = document.getElementById(chip.getAttribute('data-target'));
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      $$('.site-grid', viewRoot).forEach(function (grid) {
        Array.from(grid.children).forEach(function (el, i) {
          el.style.transitionDelay = Math.min(i, 8) * 45 + 'ms';
          el.addEventListener('transitionend', function handler(ev) {
            if (ev.propertyName === 'opacity') {
              el.style.transitionDelay = '';
              el.removeEventListener('transitionend', handler);
            }
          });
        });
      });

      observeReveals(viewRoot);
      initCollapsibles();
    }

    function renderSearch(q) {
      const results = searchSites(q);

      let body;
      if (results.length) {
        body = '<div class="result-list">' +
                 results.map(s => resultRowHTML(s, q)).join('') +
               '</div>';
      } else {
        body = '' +
          '<div class="empty-state">' +
            '<div class="empty-icon" aria-hidden="true">🔍</div>' +
            '<h3>没有找到相关网站</h3>' +
            '<p>换个关键词试试，比如「设计」「AI」「Python」「视频」「文档」。</p>' +
          '</div>';
      }

      viewRoot.innerHTML = '' +
        '<section class="search-view">' +
          '<div class="container">' +
            '<a class="back-link" href="#/">← 返回首页</a>' +
            '<div class="search-head">' +
              '<h1>搜索结果</h1>' +
              '<p class="search-meta">关键词 “<strong>' + escapeHtml(q) + '</strong>” · ' +
                '共找到 <strong>' + results.length + '</strong> 个相关网站</p>' +
            '</div>' +
            body +
          '</div>' +
        '</section>';

      const rows = $$('.result-row', viewRoot);
      rows.forEach(function (row, i) {
        window.setTimeout(function () {
          row.classList.add('is-in');
        }, 60 + i * 80);
      });
    }

    function renderSite(id) {
      const s = SITES.find(x => x.id === id);

      if (!s) {
        viewRoot.innerHTML = '' +
          '<section class="search-view">' +
            '<div class="container">' +
              '<a class="back-link" href="#/">← 返回首页</a>' +
              '<div class="empty-state">' +
                '<div class="empty-icon" aria-hidden="true">🧭</div>' +
                '<h3>找不到这个网站</h3>' +
                '<p>它可能已被移除，或者链接输入有误。</p>' +
              '</div>' +
            '</div>' +
          '</section>';
        return;
      }

      const related = SITES
        .filter(x => x.cat === s.cat && x.id !== s.id)
        .slice(0, 4);

      viewRoot.innerHTML = '' +
        '<section class="detail-view">' +
          '<div class="container">' +
            '<a class="back-link" href="#/">← 返回首页</a>' +

            '<article class="detail-card">' +
              '<div class="detail-head">' +
                iconHTML(s, 'detail-icon') +
                '<div>' +
                  '<h1>' + escapeHtml(s.name) + '</h1>' +
                  '<div class="tag-list">' +
                    '<span class="tag">' + escapeHtml(s.cat) + '</span>' +
                    s.tags.map(t => '<span class="tag tag-soft">' + escapeHtml(t) + '</span>').join('') +
                  '</div>' +
                '</div>' +
              '</div>' +

              '<p class="detail-desc">' + escapeHtml(s.desc) + '</p>' +

              '<div class="detail-actions">' +
                '<a class="btn btn-primary" href="' + escapeHtml(s.url) + '" ' +
                   'target="_blank" rel="noopener noreferrer">访问网站 <span aria-hidden="true">↗</span></a>' +
                '<button class="btn btn-ghost" id="copyBtn" type="button">复制链接</button>' +
                '<span class="copy-tip" id="copyTip" role="status" aria-live="polite"></span>' +
              '</div>' +

              '<div class="detail-url">' + escapeHtml(s.url) + '</div>' +
            '</article>' +

            (related.length
              ? '<section class="related">' +
                  '<h2>同类网站</h2>' +
                  '<div class="site-grid">' + related.map(cardHTML).join('') + '</div>' +
                '</section>'
              : '') +
          '</div>' +
        '</section>';

      const copyBtn = $('#copyBtn', viewRoot);
      const copyTip = $('#copyTip', viewRoot);

      function showTip(msg) {
        copyTip.textContent = msg;
        copyTip.classList.add('is-show');
        window.setTimeout(function () { copyTip.classList.remove('is-show'); }, 1800);
      }

      copyBtn.addEventListener('click', function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(s.url)
            .then(function () { showTip('已复制'); })
            .catch(function () { legacyCopy(s.url); });
        } else {
          legacyCopy(s.url);
        }
      });

      function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showTip('已复制');
        } catch (err) {
          showTip('复制失败，请手动复制');
        }
        ta.remove();
      }

      observeReveals(viewRoot);
    }

    /* =========================================================
       6. 滚动入场观察器
       ========================================================= */
    const revealObserver = ('IntersectionObserver' in window)
      ? new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.06, rootMargin: '0px 0px -40px 0px' })
      : null;

    function observeReveals(scope) {
      const els = $$('.reveal', scope || document);
      if (!revealObserver) {
        els.forEach(el => el.classList.add('is-visible'));
        return;
      }
      els.forEach(el => revealObserver.observe(el));
    }

    /* =========================================================
       7. 路由
       ========================================================= */
    function route() {
      const hash = location.hash.replace(/^#/, '') || '/';
      closeSuggest();

      if (hash.indexOf('/site/') === 0) {
        renderSite(decodeURIComponent(hash.slice(6)));
      } else if (hash.indexOf('/search/') === 0) {
        const q = decodeURIComponent(hash.slice(8));
        searchInput.value = q;
        searchClear.hidden = !q;
        renderSearch(q);
      } else {
        renderHome();
      }

      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    window.addEventListener('hashchange', route);

    /* =========================================================
       8. 搜索交互
       ========================================================= */
    const searchForm   = $('#searchForm');
    const searchInput  = $('#searchInput');
    const searchClear  = $('#searchClear');
    const suggestBox   = $('#suggest');

    let suggestItems = [];
    let activeIndex = -1;

    function closeSuggest() {
      suggestBox.hidden = true;
      suggestBox.innerHTML = '';
      suggestItems = [];
      activeIndex = -1;
      searchInput.setAttribute('aria-expanded', 'false');
    }

    function openSuggest(q) {
      const list = searchSites(q).slice(0, 8);

      if (!list.length) {
        suggestBox.innerHTML = '<div class="suggest-empty">没有匹配的网站，按回车查看完整结果</div>';
        suggestBox.hidden = false;
        searchInput.setAttribute('aria-expanded', 'true');
        suggestItems = [];
        activeIndex = -1;
        return;
      }

      suggestBox.innerHTML = list.map(function (s) {
        return '' +
          '<a class="suggest-item" role="option" href="#/site/' + encodeURIComponent(s.id) + '">' +
            iconHTML(s, 'suggest-icon') +
            '<span class="suggest-main">' +
              '<span class="suggest-name">' + highlight(s.name, q) + '</span>' +
              '<span class="suggest-cat">' + escapeHtml(s.cat) + '</span>' +
            '</span>' +
          '</a>';
      }).join('');

      suggestBox.hidden = false;
      searchInput.setAttribute('aria-expanded', 'true');
      suggestItems = $$('.suggest-item', suggestBox);
      activeIndex = -1;
    }

    function setActive(i) {
      if (!suggestItems.length) return;
      if (i < 0) i = suggestItems.length - 1;
      if (i >= suggestItems.length) i = 0;
      activeIndex = i;
      suggestItems.forEach(function (el, idx) {
        const on = idx === i;
        el.classList.toggle('is-active', on);
        el.setAttribute('aria-selected', String(on));
      });
      suggestItems[i].scrollIntoView({ block: 'nearest' });
    }

    searchInput.addEventListener('input', function () {
      const q = searchInput.value.trim();
      searchClear.hidden = !q;
      if (!q) { closeSuggest(); return; }
      openSuggest(q);
    });

    searchInput.addEventListener('focus', function () {
      const q = searchInput.value.trim();
      if (q) openSuggest(q);
    });

    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeSuggest(); return; }
      if (suggestBox.hidden || !suggestItems.length) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setActive(activeIndex + 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setActive(activeIndex - 1);
      } else if (e.key === 'Enter' && activeIndex >= 0) {
        e.preventDefault();
        location.hash = suggestItems[activeIndex].getAttribute('href');
        closeSuggest();
      }
    });

    searchForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) { searchInput.focus(); return; }

      closeSuggest();

      const target = '#/search/' + encodeURIComponent(q);
      if (location.hash === target) {
        renderSearch(q);
        window.scrollTo({ top: 0, behavior: 'auto' });
      } else {
        location.hash = target;
      }
      searchInput.blur();
    });

    searchClear.addEventListener('click', function () {
      searchInput.value = '';
      searchClear.hidden = true;
      closeSuggest();
      searchInput.focus();
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('#searchBox')) closeSuggest();
    });

    suggestBox.addEventListener('click', function () {
      closeSuggest();
    });

    /* =========================================================
       9. 主题切换
       ========================================================= */
    const root = document.documentElement;
    const themeToggle = $('#themeToggle');

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      themeToggle.setAttribute('aria-label',
        theme === 'dark' ? '切换到浅色主题' : '切换到深色主题');
      try { localStorage.setItem('nav-theme', theme); } catch (e) {}
    }

    applyTheme(root.getAttribute('data-theme') || 'light');

    themeToggle.addEventListener('click', function () {
      applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* =========================================================
       10. 滚动阴影 + 年份 + 启动
       ========================================================= */
    const header = $('#siteHeader');
    let ticking = false;

    function onScroll() {
      header.classList.toggle('is-scrolled', window.scrollY > 8);
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(onScroll);
      }
    }, { passive: true });

    onScroll();

    $('#year').textContent = new Date().getFullYear();

    route();
  })();
  </script>
</body>
</html>
